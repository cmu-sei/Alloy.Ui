# Approve and queue auto-merge for Dependabot patch updates.
#
# Uses only GitHub-owned actions. Acts only on pull requests opened by
# dependabot[bot] in cmu-sei repositories. Patch updates (per Dependabot's
# update-type metadata; for a grouped PR, the largest bump in the group) are
# approved and queued for auto-merge; minor and major updates are left for a
# human to review. Nothing from the pull request is checked out or executed.
#
# Approval and merge use a token from the org's crucible-ci GitHub App, not
# GITHUB_TOKEN: merges made with GITHUB_TOKEN do not trigger push workflows,
# so the image build on main would not run. Requires, in this order:
# 1. The App installed on this repository, and CRUCIBLE_HELM_UPDATE_CLIENT_ID /
#    CRUCIBLE_HELM_UPDATE_PRIVATE_KEY available as Dependabot secrets.
# 2. Required status checks on main, so auto-merge waits for CI.
# 3. "Allow auto-merge" enabled in the repository settings.
# Until 3 is done the merge step fails on purpose so the gap is visible.
#
# Both actions are SHA-pinned (Dependabot keeps the pins current): actionlint's
# bundled metadata predates create-github-app-token's client-id input and
# rejects a tag ref.

name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository_owner == 'cmu-sei'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Leave non-patch update for review
        if: steps.meta.outputs.update-type != 'version-update:semver-patch'
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: echo "::notice::Leaving $UPDATE_TYPE update for human review."

      - name: Check App credentials
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          CLIENT_ID: ${{ secrets.CRUCIBLE_HELM_UPDATE_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.CRUCIBLE_HELM_UPDATE_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            exit 0
          fi
          echo "::error::App credentials not available; make CRUCIBLE_HELM_UPDATE_CLIENT_ID/PRIVATE_KEY Dependabot secrets for this repository"
          exit 1

      - name: Mint crucible-ci App token
        id: app-token
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CRUCIBLE_HELM_UPDATE_CLIENT_ID }}
          private-key: ${{ secrets.CRUCIBLE_HELM_UPDATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Approve and enable auto-merge
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail
          gh pr review --approve "$PR_URL" --body "Auto-approved: Dependabot $UPDATE_TYPE update ($DEPS)."
          gh pr merge --auto --squash "$PR_URL"
