<div
  class="app-events-container"
  [class.has-background]="backgroundImage"
  [style.--landing-background]="backgroundImage"
  fxLayout="column"
  fxLayoutAlign="center stretch"
  fxFlexFill
>
  @if (!hideTopbar) {
    <app-topbar [title]="titleText" [topbarView]="TopbarView.ALLOY_HOME" />
  }
  @if (permissions) {
    <span>
      <div class="top-row">
        <div class="one-cell last-cell">
          @if (canViewAdministration) {
            <button
              aria-label="Show Administration Page"
              mat-icon-button
              [routerLink]="['/admin']"
              style="outline: none"
              title="Administration"
            >
              <mat-icon class="mdi-24px center-self" fontIcon="mdi-cog" />
            </button>
          }
        </div>
      </div>
      <app-event-list />
    </span>
  }
</div>
